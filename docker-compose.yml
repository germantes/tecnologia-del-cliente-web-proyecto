services:
  server:
    build:
      context: ./mockup-server
      dockerfile: Dockerfile
    container_name: bancosol-server
    environment:
      NODE_ENV: development
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      API_URL: ${API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./mockup-server:/app
      - ./public:/public
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  client:
    image: node:20-alpine
    container_name: bancosol-client
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: ${API_URL:-http://server:3000}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/mockup-server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      - server
