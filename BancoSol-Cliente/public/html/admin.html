<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador — Panel</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="../js/config.js"></script>
</head>

<body class="page-app">

  <app-header></app-header>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Bienvenido 👋</div>
        <div class="page-sub">Panel de administración</div>
      </div>
    </div>

    <div class="dash-grid">
      <a href="personal.html" class="dash-card">
        <span class="dash-icon">👥</span>
        <div>
          <div class="dash-label">Personal</div>
          <div class="dash-sub">Gestionar empleados</div>
        </div>
      </a>
      <a href="viewer.html" class="dash-card">
        <span class="dash-icon">🔍</span>
        <div>
          <div class="dash-label">Visor JSON</div>
          <div class="dash-sub">Explorar datos de la API</div>
        </div>
      </a>
      <a href="config.html" class="dash-card">
        <span class="dash-icon">⚙️</span>
        <div>
          <div class="dash-label">Configuración</div>
          <div class="dash-sub">Ajustes del sistema</div>
        </div>
      </a>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Estado del sistema</div>
      </div>
      <div id="health-info" class="loading">
        <div class="spinner"></div> Comprobando servidor...
      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script>
    // Verificar sesión y perfil
    const perfil = sessionStorage.getItem('perfil');
    if (!perfil || perfil !== 'admin') { window.location.href = 'index.html'; }

    // Comprobar health del servidor
    fetch('http://localhost:3000/health')
      .then(r => r.json())
      .then(data => {
        document.getElementById('health-info').innerHTML =
          `<div class="alert alert-success" style="margin:0">
            ✅ Servidor activo — ${data.time}
          </div>`;
      })
      .catch(() => {
        document.getElementById('health-info').innerHTML =
          `<div class="alert alert-error" style="margin:0">
            ❌ No se puede conectar con el servidor en <strong>localhost:3000</strong>.<br>
            Ejecuta: <code>cd servidor && npm install && npm start</code>
          </div>`;
      });
  </script>
</body>

</html>
