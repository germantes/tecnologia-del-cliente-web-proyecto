<link rel="stylesheet" href="/css/header.css">
<!-- REQUISITO: Incluimos el script de utilidades de autenticación para que esté disponible globalmente en la parte Vanilla -->
<script src="/js/authUtils.js"></script>

<header class="bancosol-header">
    <a class="bancosol-header__logo-link" href="/homepage" aria-label="Ir a inicio">
        <img class="bancosol-header__logo" src="../resources/img/BancosolLogo.png" alt="BancoSol Alimentos">
    </a>

    <div class="bancosol-header__actions">
        <a class="bancosol-header__profile" href="/perfil" aria-label="Ir al perfil">
            <svg class="bancosol-header__profile-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor"
                    d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.31 0-10 1.67-10 5v3h20v-3c0-3.33-6.69-5-10-5Z">
                </path>
            </svg>
            Perfil
        </a>

        <button class="bancosol-header__logout" type="button" data-logout aria-label="Cerrar sesión">
            <svg class="bancosol-header__logout-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor"
                    d="M10 3a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V5H5v14h4v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6Zm6.3 4.3a1 1 0 0 1 1.4 0l4 4a1 1 0 0 1 0 1.4l-4 4a1 1 0 1 1-1.4-1.4L18.6 13H10a1 1 0 1 1 0-2h8.6l-2.3-2.3a1 1 0 0 1 0-1.4Z">
                </path>
            </svg>
            Cerrar sesión
        </button>
    </div>

    <nav class="bancosol-header__nav" aria-label="Navegación principal">
        <a class="bancosol-header__nav-item bancosol-header__nav-item--active" data-nav="inicio" href="/homepage">Inicio</a>
        <a class="bancosol-header__nav-item" data-nav="campanias" href="/campanias">Campañas</a>
        <a class="bancosol-header__nav-item" data-nav="cadenas" href="/cadenas">Cadenas</a>
        <a class="bancosol-header__nav-item" data-nav="zonas" href="/zonas">Zonas</a>
        <a class="bancosol-header__nav-item" data-nav="tiendas" href="/tiendas">Tiendas</a>
        <a class="bancosol-header__nav-item" data-nav="entidades" href="/entidades">Entidades</a>
        <a class="bancosol-header__nav-item" data-nav="voluntarios" href="/voluntarios">Voluntarios</a>
    </nav>
</header>
