<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BancoSol - Campañas</title>
    <script src="/api/config.js"></script>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/card-display.css" />
    
  </head>
  <body>
    <include-html
      src="../componentes/header.html"
      active="campanias"
    ></include-html>

    <main>
      <h1>Campañas</h1>
      <form class="filter-form">
        <div class="filter-group">
          <label for="filterName">Nombre:</label>
          <input
            type="text"
            id="filterName"
            placeholder="Buscar por nombre..."
          />
        </div>

        <div class="filter-group">
          <label for="filterYear">Año:</label>
          <select id="filterYear">
            <option value="">Todos los años</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
          </select>
        </div>

        <div class="filter-buttons">
          <button type="reset">Limpiar</button>
          <button type="button" id="exportBtn">Exportar</button>
        </div>
      </form>
      <div class="grid" id="container"></div>
    </main>

    <include-html src="../componentes/footer.html"></include-html>

    <script src="../js/api.js"></script>
    <script src="../componentes/include-html.js"></script>
    <script src="../js/export.js"></script>
    <script src="../js/campaigns.js"></script>
  </body>
</html>
