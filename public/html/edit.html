<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Registro - BancoSol</title>
    <link rel="stylesheet" href="../css/template.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/edit.css" />
    <script src="../js/config.js"></script>
    <script src="../js/authUtils.js" defer></script>
    <script src="../js/api.js"></script>
</head>

<body>
    <include-html src="../componentes/header.html"></include-html>

    <main class="form-wrapper">
        <form id="edit-form" class="form-element">
            <div class="total">
                <div class="form-header">
                    <h1 id="edit-title">Editar</h1>
                </div>

                <div id="alert-container"></div>

                <div class="tablas">
                    <table>
                        <tbody id="form-fields">
                            <tr>
                                <td colspan="2" style="text-align: center; padding: 20px;">
                                    <span class="spinner"></span> Cargando datos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="botones">
                    <button type="button" id="back-btn" class="btn-cerrar">Cancelar</button>
                    <button type="submit" id="save-btn" class="btn-guardar" disabled>Guardar Cambios</button>
                </div>
            </div>
        </form>
    </main>

    <include-html src="../componentes/footer.html"></include-html>

    <script src="../componentes/include-html.js"></script>
    <script src="../js/schemas.js"></script>
    <script src="../js/edit.js"></script>
</body>

</html>
