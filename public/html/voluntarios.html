<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BancoSol - Voluntarios</title>
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/card-display.css" />
    <link rel="stylesheet" href="../css/voluntarios.css" />
    <link rel="stylesheet" href="../css/turnos.css" />
    <script src="../js/config.js"></script>
    <script src="../js/authUtils.js" defer></script>
</head>

<body>
    <include-html src="../componentes/header.html" active="voluntarios"></include-html>

    <main>
        <h1>Voluntarios</h1>

        <form class="filter-form">
            <div class="filter-group">
                <label for="buscadorVoluntarios">Nombre:</label>
                <input type="text" id="buscadorVoluntarios" placeholder="Buscar por nombre o email..." />
            </div>

            <div class="filter-group">
                <label for="filtroEntidad">Entidad:</label>
                <select id="filtroEntidad">
                    <option value="">Todas las entidades</option>
                </select>
            </div>

            <div class="filter-buttons">
                <button type="reset">Limpiar</button>
                <a href="/html/edit.html?type=voluntarios" id="btn-nuevo">Nuevo Voluntario</a>
            </div>
        </form>

        <div class="grid" id="voluntariosGrid">
            <div class="voluntarios-vacio">
                <h3>Cargando voluntarios...</h3>
            </div>
        </div>

        <div class="popup-voluntario" id="popupVoluntario" aria-hidden="true" style="display: none;">
            <div class="popup-voluntario-overlay" onclick="cerrarInfoVoluntario();"></div>
            <div class="popup-voluntario-panel" role="dialog" aria-modal="true" aria-labelledby="popupVoluntarioTitulo">
                <div class="popup-voluntario-header">
                    <h2 id="popupVoluntarioTitulo">Información voluntario</h2>
                    <button type="button" class="popup-voluntario-cerrar" aria-label="Cerrar"
                        onclick="cerrarInfoVoluntario();">&times;</button>
                </div>
                <div id="popupVoluntarioContenido">
                    <table class="popup-voluntario-tabla">
                        <tbody>
                            <tr>
                                <th>Nombre</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Teléfono</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Entidad</th>
                                <td>Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <include-html src="../componentes/footer.html"></include-html>

    <script src="../js/api.js"></script>
    <script src="../componentes/include-html.js"></script>
    <script src="../js/voluntarios.js"></script>
</body>

</html>
