<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de entidades</title>
    <link rel="stylesheet" href="../css/turnos.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/template.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/entidades.css">
    <script src="../js/config.js"></script>
    <!-- Cargar authUtils de forma explícita para asegurarnos de que window.obtenerRolDeToken exista antes de ejecutar los scripts de la vista -->
    <script src="../js/authUtils.js" defer></script>

</head>

<body class="page-app">

    <include-html src="../componentes/header.html" active="entidades"></include-html>

    <main class="main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Lista de Entidades</h1>
            </div>
            <a href="/html/edit.html?type=entidades" id="btn-nuevo" class="btn btn-primary">+ Nueva Entidad</a>
        </div>

        <div id="filtros-entidades-container" class="filtros-container">
            <input type="text" id="buscadorEntidades" class="filtro-input" placeholder="Buscar por nombre o CP...">
            <select id="filtroVinculado" class="filtro-select">
                <option value="">Vinculación (Todas)</option>
                <option value="true">Vinculadas</option>
                <option value="false">No vinculadas</option>
            </select>
        </div>
        <div class="entidades-grid" id="entidadesGrid">
            <div class="entidades-vacio">
                <h3>Cargando entidades...</h3>
            </div>
        </div>

        <div class="popup-entidad" id="popupEntidad" aria-hidden="true" style="display: none;">
            <div class="popup-entidad-overlay" onclick="cerrarInfoEntidad();"></div>
            <div class="popup-entidad-panel" role="dialog" aria-modal="true" aria-labelledby="popupEntidadTitulo">
                <div class="popup-entidad-header">
                    <h2 id="popupEntidadTitulo">Información entidad</h2>
                    <button type="button" class="popup-entidad-cerrar" aria-label="Cerrar"
                        onclick="cerrarInfoEntidad();">×</button>
                </div>
                <div id="popupEntidadContenido">
                    <table class="popup-entidad-tabla">
                        <tbody>
                            <tr>
                                <th>Nombre</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Código Bancosol</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Vinculado Bancosol</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Domicilio</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>CP</th>
                                <td>Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <include-html src="../componentes/footer.html" active="entidades"></include-html>
    <script src="../js/api.js"></script>
    <script src="../componentes/include-html.js"></script>
    <script src="../js/entidades.js"></script>
</body>

</html>
