<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BancoSol - Entidades</title>
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/card-display.css" />
    <link rel="stylesheet" href="../css/entidades.css" />
    <script src="../js/config.js"></script>
    <script src="../js/authUtils.js" defer></script>
</head>

<body>
    <include-html src="../componentes/header.html" active="entities"></include-html>

    <main>
        <h1>Entidades</h1>

        <form class="filter-form">
            <div class="filter-group">
                <label for="buscadorEntidades">Nombre:</label>
                <input type="text" id="buscadorEntidades" placeholder="Buscar por nombre..." />
            </div>

            <div class="filter-group">
                <label for="filtroVinculado">Vinculación:</label>
                <select id="filtroVinculado">
                    <option value="">Todas</option>
                    <option value="true">Vinculadas</option>
                    <option value="false">No vinculadas</option>
                </select>
            </div>

            <div class="filter-buttons">
                <button type="reset">Limpiar</button>
                <a href="/html/edit.html?type=entidades" id="btn-nuevo">Nueva Entidad</a>
            </div>
        </form>

        <div class="grid" id="entidadesGrid">
            <div class="entidades-vacio">
                <h3>Cargando entidades...</h3>
            </div>
        </div>

        <div class="popup-entidad" id="popupEntidad" aria-hidden="true" style="display: none;">
            <div class="popup-entidad-overlay" onclick="cerrarInfoEntidad();"></div>
            <div class="popup-entidad-panel" role="dialog" aria-modal="true" aria-labelledby="popupEntidadTitulo">
                <div class="popup-entidad-header">
                    <h2 id="popupEntidadTitulo">Información entidad</h2>
                    <button type="button" class="popup-entidad-cerrar" aria-label="Cerrar"
                        onclick="cerrarInfoEntidad();">&times;</button>
                </div>
                <div id="popupEntidadContenido">
                    <table class="popup-entidad-tabla">
                        <tbody>
                            <tr>
                                <th>Nombre</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Código Bancosol</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Vinculado Bancosol</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Domicilio</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>CP</th>
                                <td>Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <include-html src="../componentes/footer.html"></include-html>

    <script src="../js/api.js"></script>
    <script src="../componentes/include-html.js"></script>
    <script src="../js/entidades.js"></script>
</body>

</html>
