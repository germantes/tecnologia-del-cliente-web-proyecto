<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Voluntarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/turnos.css">
    <!-- <link rel="stylesheet" href="/css/header.css"> -->
    <link rel="stylesheet" href="/css/footer.css">

    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/voluntarios.css">
    <script src="/api/config.js"></script>
</head>

<body class="page-app">

    <include-html src="/componentes/header.html" active="voluntarios"></include-html>

    <main class="main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Lista de Voluntarios</h1>
            </div>
            <a href="/edit.html?type=voluntarios" id="btn-nuevo" class="btn btn-primary">+ Nuevo Voluntario</a>
        </div>

        <div id="filtros-voluntarios-container" class="filtros-container">
            <input type="text" id="buscadorVoluntarios" class="filtro-input" placeholder="Buscar por nombre o email...">
            <select id="filtroEntidad" class="filtro-select">
                <option value="">Todas las entidades</option>
            </select>
        </div>
        <div class="voluntarios-grid" id="voluntariosGrid">
            <div class="voluntarios-vacio">
                <h3>Cargando voluntarios...</h3>
            </div>
        </div>

        <div class="popup-voluntario" id="popupVoluntario" aria-hidden="true" style="display: none;">
            <div class="popup-voluntario-overlay" onclick="cerrarInfoVoluntario();"></div>
            <div class="popup-voluntario-panel" role="dialog" aria-modal="true" aria-labelledby="popupVoluntarioTitulo">
                <div class="popup-voluntario-header">
                    <h2 id="popupVoluntarioTitulo">Información voluntario</h2>
                    <button type="button" class="popup-voluntario-cerrar" aria-label="Cerrar"
                        onclick="cerrarInfoVoluntario();">×</button>
                </div>
                <div id="popupVoluntarioContenido">
                    <table class="popup-voluntario-tabla">
                        <tbody>
                            <tr>
                                <th>Nombre</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Teléfono</th>
                                <td>Cargando...</td>
                            </tr>
                            <tr>
                                <th>Entidad</th>
                                <td>Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <include-html src="/componentes/footer.html" active="voluntarios"></include-html>
    <script src="/js/api.js"></script>
    <script src="/componentes/include-html.js"></script>
    <script src="/js/voluntarios.js"></script>
</body>

</html>
