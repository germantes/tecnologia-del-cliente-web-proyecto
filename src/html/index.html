<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="/css/login.css" />
    <script src="/api/config.js"></script>
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <h1>BancoSol</h1>
        </div>
        
        <form class="login-form" id="login-form" novalidate>
          <p>Acceda con sus credenciales:</p>
          <div class="field">
            <label for="username">Usuario</label>
            <div class="input-wrap">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="admin"
                autocomplete="username"
                required
              />
            </div>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-eye"
                id="toggle-password"
                aria-label="Mostrar contraseña"
              >
                <img
                  src="/resources/icons/eye-closed.svg"
                  alt="Mostrar"
                  class="eye-icon"
                />
              </button>
            </div>
          </div>

          <div id="login-error" class="alert-error" hidden></div>

          <button type="submit" class="btn btn-primary btn" id="login-btn">
            <span>Entrar</span>
            <img src="/resources/icons/spinner.svg" alt="Cargando..." class="btn-spinner" hidden />
          </button>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
