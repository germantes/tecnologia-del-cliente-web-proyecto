<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observaciones del turno</title>

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/turno_observaciones.css">
    <script src="../js/config.js"></script>
</head>

<body>
    <include-html src="../componentes/header.html" active="inicio"></include-html>

    <div class="info-turnos-page">
        <div class="info-turnos-container turnos-panel">
            <header class="info-turnos-header">
                <div class="info-turnos-tienda">
                    <h1 id="nombreTienda">Nombre Tienda</h1>
                    <h2>Observaciones</h2>
                </div>

                <div class="info-turnos-datos">
                    <h2 id="fechaTurno">dd/mm/aaaa</h2>
                    <h3 id="textoTurno">Turno:</h3>
                </div>
            </header>

            <main class="info-turnos-content">
                <section id="observacionesPanel" class="observaciones-panel">
                    <p class="observaciones-vacio">Cargando observaciones...</p>
                </section>

                <div class="observaciones-acciones">
                    <a id="enlaceEditarObservaciones" class="btn-observaciones-accion turnos-btn" href="#">
                        Editar
                    </a>

                    <a id="enlaceCerrarObservaciones" class="btn-observaciones-accion turnos-btn" href="#">
                        Cerrar
                    </a>
                </div>
            </main>
        </div>
    </div>

    <include-html src="../componentes/footer.html"></include-html>

    <script src="../componentes/include-html.js"></script>
    <script src="../js/turno_observaciones_api.js"></script>
    <script src="../js/turno_observaciones.js"></script>
</body>

</html>
