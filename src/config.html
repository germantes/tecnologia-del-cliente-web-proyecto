<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="stylesheet" href="css/common.css">
  <script src="/api/config.js"></script>
</head>

<body class="page-app">

  <nav class="navbar">
    <a href="admin.html" class="navbar-brand">
      <span class="navbar-icon">⬡</span> Panel de control
    </a>
    <ul class="navbar-nav">
      <li><a href="admin.html">🏠 Inicio</a></li>
      <li><a href="personal.html">👥 Personal</a></li>
      <li><a href="viewer.html">🔍 Visor JSON</a></li>
    </ul>
    <div class="navbar-right">
      <button class="btn btn-outline btn-sm" id="btn-logout">Cerrar sesión</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">⚙️ Configuración</div>
    </div>
    <div class="card" style="text-align:center;padding:64px 32px;color:var(--color-text-muted)">
      <div style="font-size:48px;margin-bottom:16px">🚧</div>
      <div style="font-size:18px;font-weight:500;color:var(--color-text);margin-bottom:8px">Sección en construcción
      </div>
      <div>Esta página está pendiente de implementación.</div>
      <a href="admin.html" class="btn btn-primary" style="margin-top:24px;display:inline-flex">← Volver al inicio</a>
    </div>
  </main>

  <script>
    const perfil = sessionStorage.getItem('perfil');
    if (!perfil || perfil !== 'admin') { window.location.href = 'index.html'; }
    document.getElementById('btn-logout').addEventListener('click', () => {
      sessionStorage.clear(); window.location.href = 'index.html';
    });
  </script>
</body>

</html>
