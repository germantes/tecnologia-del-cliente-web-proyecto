<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker — Panel</title>
  <link rel="stylesheet" href="css/common.css">
</head>

<body class="page-app">

  <app-header></app-header>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Mi espacio de trabajo 🔧</div>
        <div class="page-sub">Acciones disponibles para tu perfil</div>
      </div>
    </div>

    <div class="dash-grid">
      <a href="viewer.html" class="dash-card">
        <span class="dash-icon">🔍</span>
        <div>
          <div class="dash-label">Visor JSON</div>
          <div class="dash-sub">Ver datos de la API</div>
        </div>
      </a>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:16px">Mis datos</div>
      <div id="mi-info">
        <div class="loading">
          <div class="spinner"></div> Cargando...
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script>
    const perfil = sessionStorage.getItem('perfil');
    if (!perfil) { window.location.href = 'index.html'; }

    const usuario = JSON.parse(sessionStorage.getItem('usuario') || '{}');
    // Mostrar info del usuario desde sessionStorage
    const info = document.getElementById('mi-info');
    info.innerHTML = `
      <div class="json-card" style="max-width:400px">
        <div class="json-card-header">
          <span>Mi perfil</span>
          <span class="badge badge-worker" style="font-size:11px">worker</span>
        </div>
        <div class="json-card-body">
          <div class="json-field">
            <span class="json-field-key">Nombre</span>
            <span class="json-field-val">${usuario.nombre || '—'}</span>
          </div>
          <div class="json-field">
            <span class="json-field-key">Usuario</span>
            <span class="json-field-val">${usuario.nombreUsuario || '—'}</span>
          </div>
          <div class="json-field">
            <span class="json-field-key">Perfil</span>
            <span class="json-field-val"><span class="badge badge-worker">worker</span></span>
          </div>
        </div>
      </div>
    `;
  </script>
</body>

</html>
