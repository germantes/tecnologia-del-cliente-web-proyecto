<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoSol - Tiendas por Zona</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/tiendas.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

<div w3-include-html="header.html"></div>

<main style="flex: 1; padding-top: 20px;">
    <header style="margin-bottom: 20px; text-align: center;">
        <h1 style="color: #323266; font-size: 2.5rem; margin: 0;">Tiendas por Zona</h1>
    </header>

    <div id="adminFilters" style="display: none; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <label style="color: #323266; font-weight: bold;">Zona:</label>
            <select id="selectZona" style="padding: 8px; border: 2px solid #323266; border-radius: 5px; font-weight: 600; color: #323266;">
                <option value="0">Todas las zonas</option>
            </select>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <label style="color: #323266; font-weight: bold;">Campaña:</label>
            <select id="selectParticipa" style="padding: 8px; border: 2px solid #323266; border-radius: 5px; font-weight: 600; color: #323266;">
                <option value="all">Todas</option>
                <option value="true">Participan</option>
                <option value="false">No participan</option>
            </select>
        </div>
    </div>

    <div class="tiendas-grid" id="tiendasContainer">
    </div>
</main>

<div w3-include-html="footer.html"></div>

<script src="include-html.js"></script>
<script src="tiendas.js"></script>
</body>
</html>
