<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoSol - Tiendas por Zona</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/tiendas.css">
    <script src="/api/config.js"></script>
</head>
<body class="page-app">

<app-header></app-header>

<main class="main">
    <div class="page-header" style="justify-content: center; text-align: center; margin-bottom: 30px;">
        <div>
            <h1 class="page-title" style="color: var(--twilight-indigo); font-size: 2.5rem;">Tiendas por Zona</h1>
        </div>
    </div>

    <div id="adminFilters" class="barra-filtro" style="display: none;">
        <form onsubmit="event.preventDefault();">
            <label for="selectZona">Zona:</label>
            <select id="selectZona">
                <option value="0">Todas las zonas</option>
            </select>

            <label for="selectParticipa" style="margin-left: 15px;">Campaña:</label>
            <select id="selectParticipa">
                <option value="all">Todas</option>
                <option value="true">Participan</option>
                <option value="false">No participan</option>
            </select>
        </form>
    </div>

    <div class="tiendas-grid" id="tiendasContainer">
    </div>
</main>

<app-footer></app-footer>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/tiendas.js"></script>
</body>
</html>
